<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кредиты и Подписки — Учёт и Аналитика</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="reminder-banner" id="reminderBanner" style="display:none;">
        <div class="reminder-banner__content">
            <span class="reminder-banner__icon">&#9888;</span>
            <span id="reminderText"></span>
            <button class="reminder-banner__close" onclick="document.getElementById('reminderBanner').style.display='none'">&times;</button>
        </div>
    </div>

    <header class="header">
        <div class="header__inner">
            <h1 class="header__title">Учёт кредитов и подписок</h1>
            <nav class="nav">
                <button class="nav__btn active" data-tab="overview">Обзор</button>
                <button class="nav__btn" data-tab="credits">Кредиты</button>
                <button class="nav__btn" data-tab="subscriptions">Подписки</button>
                <button class="nav__btn" data-tab="analytics">Аналитика</button>
            </nav>
            <div class="header__actions">
                <button class="btn btn-outline btn-sm" onclick="App.exportData()">Экспорт</button>
                <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">Импорт</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="App.importData(this)">
            </div>
        </div>
    </header>

    <main class="main" id="mainContent"></main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal__header">
                <h3 class="modal__title" id="modalTitle"></h3>
                <button class="modal__close" onclick="App.closeModal()">&times;</button>
            </div>
            <div class="modal__body" id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/reminders.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
